# XcodeGen spec — run `xcodegen generate` to create CarMate1.xcodeproj
name: CarMate1
options:
  bundleIdPrefix: com.abdulrahmanb
  deploymentTarget:
    iOS: "17.0"
targets:
  CarMate1:
    type: application
    platform: iOS
    sources: [CarMate1]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulrahmanb.CarMate1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CarMate
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CarMate uses your location to show nearby service centers on the map."
